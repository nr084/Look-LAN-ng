name: Validate locally built Windows ARM64
on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: Private temporary draft asset containing local binaries
        required: true
      sha256:
        description: SHA-256 of the uploaded archive
        required: true
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Run prebuilt binaries (no compilation)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.asset_id }}
          ARCHIVE_SHA256: ${{ inputs.sha256 }}
        run: |
          $ErrorActionPreference='Stop'
          if([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64'){throw 'Native ARM64 OS required'}
          if($env:ASSET_ID -notmatch '^\d+$' -or $env:ARCHIVE_SHA256 -notmatch '^[a-f0-9]{64}$'){throw 'Invalid input'}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/octet-stream'}
          Invoke-WebRequest "https://api.github.com/repos/${{ github.repository }}/releases/assets/$env:ASSET_ID" -Headers $headers -OutFile native.zip
          if((Get-FileHash native.zip).Hash.ToLowerInvariant() -ne $env:ARCHIVE_SHA256){throw 'Archive digest mismatch'}
          Expand-Archive native.zip native
          Set-Location native
          $proof=Get-Content checks.json -Raw | ConvertFrom-Json
          $results=[ordered]@{os=[Environment]::OSVersion.VersionString;architecture='ARM64';exe_sha256=$proof.exe_sha256;tests=[ordered]@{}}
          foreach($name in $proof.tests){
            $args=@{FilePath=(Join-Path $pwd $name);RedirectStandardOutput="$name.log";RedirectStandardError="$name.err";PassThru=$true;WindowStyle='Hidden'}
            if($name -eq 'files_tests.exe'){$args.ArgumentList=@($pwd.Path)}
            $p=Start-Process @args
            if(!$p.WaitForExit(60000)){$p.Kill();throw "Timeout $name"}
            if($p.ExitCode -ne 0){throw "$name failed: $($p.ExitCode)"}
            $results.tests[$name]='passed'
          }
          if((Get-FileHash 'Look@LAN-ng.exe').Hash.ToLowerInvariant() -ne $proof.exe_sha256){throw 'Packed executable digest mismatch'}
          foreach($mode in @('--smoke-test','--smoke-dpi','--smoke-close-scan','--smoke-close-tools')){
            $p=Start-Process (Join-Path $pwd 'Look@LAN-ng.exe') -ArgumentList $mode -PassThru -WindowStyle Hidden
            if(!$p.WaitForExit(30000)){$p.Kill();throw "Timeout $mode"}
            if($p.ExitCode -eq 77){$results.tests[$mode]='skipped_no_ipv4'}
            elseif($p.ExitCode -ne 0){throw "$mode failed: $($p.ExitCode)"}
            else{$results.tests[$mode]='passed'}
          }
          $results | ConvertTo-Json -Depth 5 | Set-Content native-results.json
          Get-Content native-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-arm64-results
          path: |
            native/*.log
            native/*.err
            native/native-results.json
