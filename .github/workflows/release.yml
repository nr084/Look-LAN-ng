name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86
            runner: windows-2022
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./tools/build-windows.ps1 -Architecture '${{ matrix.architecture }}'
      - name: Pack and test packed executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/package-windows-arch.ps1 -Architecture '${{ matrix.architecture }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: dist/windows-${{ matrix.architecture }}/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: One architecture, one ZIP
        shell: pwsh
        run: ./tools/collect-windows-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/look@lan-ng-*.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = @(Get-ChildItem dist/look@lan-ng-*.zip)
          if ($zip.Count -ne 3) { throw 'Expected three architecture ZIPs' }
          gh release create "$env:GITHUB_REF_NAME" $zip[0].FullName $zip[1].FullName $zip[2].FullName --verify-tag --title "Look@LAN-ng $env:GITHUB_REF_NAME" --notes-file dist/release-notes.md
          if ($LASTEXITCODE) { throw 'Release publication failed' }
